spring.application.name=api-playground-backend
server.port=8080

# External API keys are read from environment variables.
# Copy .env.example to .env and load it (IntelliJ: Run > Edit Configurations > Environment variables).
# Missing REQUIRED keys make the related endpoint return a clean 503, never a 500.
tmdb.api-key=${TMDB_API_KEY:}
unsplash.access-key=${UNSPLASH_ACCESS_KEY:}
news.api-key=${NEWS_API_KEY:}
football-data.api-key=${FOOTBALL_DATA_KEY:}
nasa.api-key=${NASA_API_KEY:DEMO_KEY}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# Las APIs externas devuelven muchos más campos de los que mapeamos en los records.
# Esto evita que Jackson reviente por propiedades desconocidas.
spring.jackson.deserialization.fail-on-unknown-properties=false